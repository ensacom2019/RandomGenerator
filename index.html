<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="룰렛, 핀볼, 추첨, 로또 번호 뽑기로 즐기는 랜덤 뽑기 생성기">
  <title>랜덤 생성기 - 룰렛 / 핀볼 / 추첨 / 번호 뽑기</title>
  <link rel="stylesheet" href="css/roulette.css?v=2.0">
  <link rel="stylesheet" href="css/pinball.css?v=2.0">
  <link rel="stylesheet" href="css/draw.css?v=2.0">
  <link rel="stylesheet" href="css/lotto.css?v=2.0">
</head>
<body>
  <!-- 상단 탭 바 (버튼은 tabs.js 가 register 된 탭 기준으로 자동 생성) -->
  <nav id="tabBar" class="tab-bar" role="tablist"></nav>

  <!-- ========== 룰렛 ========== -->
  <section id="panel-roulette" class="tab-panel" role="tabpanel">
    <h1>룰렛 돌리기</h1>
    <div class="toolbar">
      <button id="btnAdd" class="tool">항목 추가</button>
      <button id="btnBulk" class="tool">한번에 넣기</button>
      <button id="btnRemove" class="tool">항목 제거</button>
      <button id="btnReset" class="tool">리셋</button>
      <span class="toolbar-sep"></span>
      <button id="btnPresetManage" class="tool preset-btn-main">💾 프리셋 (1~10)</button>
    </div>

    <!-- 프리셋 빠른 선택 바 -->
    <div class="preset-quick-bar">
      <label class="preset-quick-label">
        <span>프리셋 슬롯:</span>
        <select id="presetQuickSelect" class="preset-select"></select>
      </label>
      <button id="btnQuickLoad" class="tool" type="button">불러오기</button>
      <button id="btnQuickSave" class="tool" type="button">현재 룰렛 저장</button>
    </div>

    <!-- 룰렛 일괄 입력 모달 -->
    <div id="bulkModal" class="bulk-modal" hidden>
      <div class="bulk-card">
        <div class="bulk-title">📝 항목 한번에 넣기</div>
        <p class="bulk-desc">
          쉼표(,) 또는 줄바꿈으로 구분하여 입력하세요.<br>
          모든 항목이 <b>동일한 비율(확률)</b>로 적용됩니다.
        </p>
        <textarea id="bulkInput" class="bulk-input" placeholder="예시: 사과, 바나나, 딸기, 포도, 수박, 복숭아" rows="6"></textarea>
        <div class="bulk-mode-wrap">
          <label><input type="radio" name="bulkMode" value="replace" checked> 기존 항목 바꾸기</label>
          <label><input type="radio" name="bulkMode" value="append"> 기존 항목에 추가하기</label>
        </div>
        <div class="bulk-actions">
          <button id="btnBulkCancel" class="tool" type="button">취소</button>
          <button id="btnBulkApply" class="primary" type="button">적용하기</button>
        </div>
      </div>
    </div>

    <!-- 룰렛 프리셋 관리 모달 -->
    <div id="presetModal" class="preset-modal" hidden>
      <div class="preset-card">
        <div class="preset-modal-header">
          <div class="preset-title">💾 룰렛 프리셋 관리 (1~10)</div>
          <button id="btnPresetModalClose" class="preset-close-btn" type="button">&times;</button>
        </div>
        <p class="preset-desc">
          자주 쓰는 룰렛 항목을 최대 10개까지 슬롯에 저장하고 언제든 불러올 수 있습니다.
        </p>
        <div id="presetList" class="preset-list"></div>
        <div class="preset-actions">
          <button id="btnPresetModalOk" class="primary" type="button">닫기</button>
        </div>
      </div>
    </div>

    <main>
      <section class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="520" height="520"></canvas>
      </section>

      <section class="list-wrap">
        <div id="list"></div>
        <div id="sumInfo" class="sum-info"></div>
      </section>
    </main>

    <div id="result" class="result">&nbsp;</div>

    <div class="controls">
      <button id="btnStart" class="primary">시작</button>
      <button id="btnStop" class="primary">정지</button>
      <button id="btnInstant" class="primary danger">즉시 정지</button>
    </div>
  </section>

  <!-- ========== 핀볼 ========== -->
  <section id="panel-pinball" class="tab-panel" role="tabpanel" hidden></section>

  <!-- ========== 추첨 ========== -->
  <section id="panel-draw" class="tab-panel" role="tabpanel" hidden></section>

  <!-- ========== 번호 뽑기 (로또 구슬함) ========== -->
  <section id="panel-lotto" class="tab-panel" role="tabpanel" hidden></section>

  <!--
    새 탭 추가 방법:
    1) 위에 <section id="panel-새id" class="tab-panel" hidden></section> 추가
    2) 새 스크립트에서 TabManager.register({ id: "새id", label: "표시 이름" }) 호출
    3) 아래에 <script src="새스크립트.js"> 추가 (스크립트 순서 = 탭 순서)
  -->
  <script src="js/tabs.js?v=2.0"></script>
  <script src="js/roulette.js?v=2.0"></script>
  <script src="js/pinball-engine.js?v=2.0"></script>
  <script src="js/pinball.js?v=2.0"></script>
  <script src="js/draw.js?v=2.0"></script>
  <script src="js/lotto.js?v=2.0"></script>
</body>
</html>
